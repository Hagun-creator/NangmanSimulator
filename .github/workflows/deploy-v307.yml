name: Deploy v3.07
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v307:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.07
        run: python scripts/build_v307.py
      - name: Commit v3.07
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_07.html latest.json README.md
          git commit -m "Show daomai exchange table ascending in v3.07" || exit 0
          git push
