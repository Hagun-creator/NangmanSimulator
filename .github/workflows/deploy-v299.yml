name: Deploy v2.99
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v299:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.99
        run: python scripts/build_v299.py
      - name: Commit v2.99
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_99.html index.html latest.json README.md
          git commit -m "Restore permanent latest loader in v2.99" || exit 0
          git push
