name: Deploy v3.03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v303:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.03
        run: python scripts/build_v303.py
      - name: Commit v3.03
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_03.html latest.json README.md
          git commit -m "Optimize daomai route search in v3.03" || exit 0
          git push
