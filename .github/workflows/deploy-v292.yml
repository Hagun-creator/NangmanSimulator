name: Deploy v2.92
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v292:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.92
        run: python scripts/build_v292.py
      - name: Commit v2.92
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_92.html index.html latest.json README.md
          git commit -m "Deploy v2.92 with permanent latest loader"
          git push
