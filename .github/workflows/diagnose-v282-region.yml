name: Diagnose v2.82 region bonus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract region bonus code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          src=Path('Nangman_Integrated_Simulator_v2_82.html')
          t=src.read_text(encoding='utf-8')
          m=re.search(r'const\s+EQUIPMENT_HTML_B64\s*=\s*"([A-Za-z0-9+/=]+)"\s*;',t)
          if not m: raise SystemExit('payload missing')
          inner=base64.b64decode(m.group(1)).decode('utf-8','replace')
          keys=['110','region','route','bonus','부가옵','명중','accuracy','hit','place','npc','search','make']
          lines=inner.splitlines()
          out=[]
          for i,line in enumerate(lines):
              lo=line.lower()
              if any(k.lower() in lo for k in keys):
                  a=max(0,i-2); b=min(len(lines),i+3)
                  out.append(f'--- lines {a+1}-{b} ---')
                  out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
          # cap but keep plenty
          Path('diagnostics_region_v282.txt').write_text('\n'.join(out)[:200000],encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics_region_v282.txt
          git commit -m "Add v2.82 region bonus diagnostics" || exit 0
          git push
