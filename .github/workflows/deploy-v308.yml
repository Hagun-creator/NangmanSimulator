name: Deploy v3.08
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v308:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.08
        run: python scripts/build_v308.py
      - name: Commit v3.08
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_08.html latest.json README.md
          git commit -m "Fix daomai duplicate-removal route in v3.08" || exit 0
          git push
