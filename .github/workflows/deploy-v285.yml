name: Deploy v2.85 with permanent guards
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v285:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build v2.85
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64

          src=Path('Nangman_Integrated_Simulator_v2_84.html')
          if not src.exists(): raise SystemExit('v2.84 source missing')
          text=src.read_text(encoding='utf-8')
          m=re.search(r'const\s+EQUIPMENT_HTML_B64\s*=\s*"([A-Za-z0-9+/=]+)"\s*;',text)
          if not m: raise SystemExit('equipment payload missing')
          inner=base64.b64decode(m.group(1)).decode('utf-8','replace')

          # Remove standalone accidental newline literals from renderable HTML.
          inner=re.sub(r'(?m)^\s*(?:\\n\s*){1,4}\s*$', '', inner)
          inner=re.sub(r'(?m)^\s*(?:/n\s*){1,4}\s*$', '', inner)
          inner=inner.replace('>\\n \\n<','><').replace('>\\n\\n<','><').replace('>/n /n<','><').replace('>/n/n<','><')
          text=re.sub(r'(?m)^\s*(?:\\n\s*){1,4}\s*$', '', text)
          text=re.sub(r'(?m)^\s*(?:/n\s*){1,4}\s*$', '', text)

          # Replace detail-back handler with parent-page coordinate scrolling.
          start=inner.find('function showDetailTop233(')
          if start<0: raise SystemExit('showDetailTop233 missing')
          end=inner.find('\nfunction paintDetail(',start)
          if end<0: raise SystemExit('showDetailTop233 end missing')
          new_fn="""function showDetailTop233(obj,backView,initialTab){R.sel=obj;R.detailBack233=backView||R.view;R.detailTab=initialTab||'xl';const m=q('#rmain');m.innerHTML=`<button type=\"button\" class=\"back218\" id=\"dback233\">← 이전 목록</button><div id=\"dtop233\"></div>`;q('#dback233').onclick=()=>{const back=R.detailBack233||'find';open(back);if(back==='find'&&R.results.length){requestAnimationFrame(()=>requestAnimationFrame(()=>{const rr=q('#rresults');if(!rr)return;try{const localY=rr.getBoundingClientRect().top+window.scrollY;if(window.parent&&window.parent!==window&&window.frameElement){const frameY=window.frameElement.getBoundingClientRect().top+window.parent.scrollY;window.parent.scrollTo(0,Math.max(0,frameY+localY-12))}else window.scrollTo(0,Math.max(0,localY-12))}catch(_){rr.scrollIntoView({block:'start'})}}))}};paintDetail(q('#dtop233'),obj);window.scrollTo(0,0)}"""
          inner=inner[:start]+new_fn+inner[end:]

          # Version bump, including visible no-v form.
          inner=inner.replace('v2.84','v2.85').replace('v2_84','v2_85')
          inner=re.sub(r'(?<![0-9])2\.84(?![0-9])','2.85',inner)
          text=text.replace('v2.84','v2.85').replace('v2_84','v2_85')
          text=re.sub(r'(?<![0-9])2\.84(?![0-9])','2.85',text)
          text=text.replace('id="v284-mobile-integrated"','id="v285-mobile-integrated"')
          inner=inner.replace('id="v284-mobile-equipment"','id="v285-mobile-equipment"')

          enc=base64.b64encode(inner.encode()).decode()
          text=text[:m.start()]+f'const EQUIPMENT_HTML_B64="{enc}";'+text[m.end():]
          Path('Nangman_Integrated_Simulator_v2_85.html').write_text(text,encoding='utf-8')
          Path('index.html').write_text(text,encoding='utf-8')

          readme=Path('README.md')
          s=readme.read_text(encoding='utf-8') if readme.exists() else '# NangmanSimulator\n'
          s=re.sub(r'현재 사이트 버전:\s*v?[0-9.]+','현재 사이트 버전: v2.85',s)
          if '현재 사이트 버전:' not in s:s+='\n현재 사이트 버전: v2.85\n'
          readme.write_text(s,encoding='utf-8')

          # Permanent validator for all future releases.
          Path('scripts').mkdir(exist_ok=True)
          Path('scripts/validate_release.py').write_text(r'''from pathlib import Path
import re,sys,base64
ver=sys.argv[1]
fn='Nangman_Integrated_Simulator_'+ver.replace('.','_')+'.html'

def text_nodes(s):
    s=re.sub(r'<script\b[^>]*>.*?</script>','',s,flags=re.I|re.S)
    s=re.sub(r'<style\b[^>]*>.*?</style>','',s,flags=re.I|re.S)
    return [x.strip() for x in re.findall(r'>([^<]+)<',s,re.S) if x.strip()]

def check(p):
    t=Path(p).read_text(encoding='utf-8')
    if f'<title>낭만강호 통합 시뮬레이터 {ver}</title>' not in t[:7000]:raise SystemExit('title mismatch '+p)
    for x in text_nodes(t):
        if '\\n' in x or '/n/n' in x or '/n /n' in x:raise SystemExit('visible newline token '+p+': '+repr(x[:80]))
    m=re.search(r'const\s+EQUIPMENT_HTML_B64\s*=\s*"([A-Za-z0-9+/=]+)"\s*;',t)
    if m:
        inn=base64.b64decode(m.group(1)).decode('utf-8','replace')
        for x in text_nodes(inn):
            if '\\n' in x or '/n/n' in x or '/n /n' in x:raise SystemExit('visible embedded newline token: '+repr(x[:80]))
        if "window.parent.scrollTo" not in inn or "q('#rresults')" not in inn:raise SystemExit('search-return scroll guard missing')
check(fn);check('index.html')
r=Path('README.md').read_text(encoding='utf-8')
if f'현재 사이트 버전: {ver}' not in r:raise SystemExit('README mismatch')
print('OK',ver)
''',encoding='utf-8')

          # Execute permanent guard now.
          import subprocess
          subprocess.check_call(['python','scripts/validate_release.py','v2.85'])
          PY
      - name: Commit v2.85
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_85.html index.html README.md scripts/validate_release.py
          git commit -m "Deploy v2.85 with stable version and search-result return"
          git push
