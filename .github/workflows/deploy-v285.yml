name: Deploy v2.85
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v285:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.85
        run: python scripts/build_v285.py
      - name: Commit v2.85
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_85.html index.html README.md scripts/validate_release.py
          git commit -m "Deploy v2.85 with fixed version and search return"
          git push
