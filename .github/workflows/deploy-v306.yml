name: Deploy v3.06
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v306:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.06
        run: python scripts/build_v306.py
      - name: Commit v3.06
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_06.html latest.json README.md
          git commit -m "Fix daomai exchange renderer in v3.06" || exit 0
          git pull --rebase origin main
          git push
