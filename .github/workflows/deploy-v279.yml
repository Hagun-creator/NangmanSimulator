name: Deploy v2.79 newline fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v279:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build v2.79 from v2.78
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          src = Path("Nangman_Integrated_Simulator_v2_78.html")
          dst = Path("Nangman_Integrated_Simulator_v2_79.html")
          if not src.exists():
              raise SystemExit("v2.78 source not found")

          def fix_style_block(s, style_id):
              marker = f'<style id="{style_id}">'
              start = s.find(marker)
              if start < 0:
                  return s
              prefix = s.rfind('\\n', 0, start)
              if prefix < 0:
                  prefix = start
              end = s.find('</style>', start)
              if end < 0:
                  return s
              end2 = end + len('</style>')
              if s.startswith('\\n', end2):
                  end2 += 2
              block = s[prefix:end2].replace('\\n', '\n')
              return s[:prefix] + block + s[end2:]

          text = src.read_text(encoding="utf-8")
          text = fix_style_block(text, "v278-mobile-integrated")
          text = text.replace('id="v278-mobile-integrated"', 'id="v279-mobile-integrated"')
          text = text.replace('v2.78 mobile shell', 'v2.79 mobile shell')
          text = text.replace('낭만강호 통합 시뮬레이터 v2.78', '낭만강호 통합 시뮬레이터 v2.79')

          m = re.search(r'const\s+EQUIPMENT_HTML_B64\s*=\s*"([A-Za-z0-9+/=]+)"\s*;', text)
          if not m:
              raise SystemExit("embedded equipment payload not found")
          inner = base64.b64decode(m.group(1)).decode("utf-8")
          inner = fix_style_block(inner, "v278-mobile-equipment")
          inner = inner.replace('id="v278-mobile-equipment"', 'id="v279-mobile-equipment"')
          inner = inner.replace('v2.78 mobile: equipment UI only', 'v2.79 mobile: equipment UI only')
          enc = base64.b64encode(inner.encode("utf-8")).decode("ascii")
          text = text[:m.start()] + f'const EQUIPMENT_HTML_B64="{enc}";' + text[m.end():]
          dst.write_text(text, encoding="utf-8")

          idx = Path("index.html")
          s = idx.read_text(encoding="utf-8")
          s = s.replace("v2.78", "v2.79").replace("v2_78", "v2_79")
          idx.write_text(s, encoding="utf-8")

          readme = Path("README.md")
          if readme.exists():
              s = readme.read_text(encoding="utf-8").replace("v2.78", "v2.79")
              readme.write_text(s, encoding="utf-8")

          # Validation: the injected style blocks must not contain literal backslash-n text.
          if '\\n<style id="v279-mobile-integrated"' in text:
              raise SystemExit("outer literal newline token remains")
          if '\\n<style id="v279-mobile-equipment"' in inner:
              raise SystemExit("inner literal newline token remains")
          PY
      - name: Commit generated v2.79
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_79.html index.html README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix literal newline text in v2.79"
          git push
