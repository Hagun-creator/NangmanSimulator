name: Deploy v3.20
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v320:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.20
        run: python scripts/build_v320.py
      - name: Commit v3.20
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_20.html latest.json README.md
          git commit -m "Share current pills and show route search progress in v3.20" || exit 0
          git pull --rebase origin main
          git push
