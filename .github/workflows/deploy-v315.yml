name: Deploy v3.15
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v315:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.15
        run: python scripts/build_v315.py
      - name: Commit v3.15
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_15.html latest.json README.md
          git commit -m "Optimize daomai seed route search in v3.15" || exit 0
          git pull --rebase origin main
          git push
