name: Deploy v3.24
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v324:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.24
        run: python scripts/build_v324.py
      - name: Commit v3.24
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_24.html latest.json README.md
          git commit -m "Display pre-pity rows from raw 600 upward in v3.24" || exit 0
          git pull --rebase origin main
          git push
