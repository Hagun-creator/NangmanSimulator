name: Deploy v3.31
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v331:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.31
        run: python scripts/build_v331.py
      - name: Commit v3.31
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_v331.py Nangman_Integrated_Simulator_v3_31.html latest.json README.md
          git commit -m "Restore known-good save load outside daomai engine in v3.31" || exit 0
          git pull --rebase origin main
          git push
