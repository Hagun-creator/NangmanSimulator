name: Deploy v3.35
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v335:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.35
        run: python scripts/build_v335.py
      - name: Commit v3.35
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_v335.py Nangman_Integrated_Simulator_v3_35.html latest.json README.md
          git commit -m "Reduce daomai branch load and restore detailed progress in v3.35" || exit 0
          git pull --rebase origin main
          git push
