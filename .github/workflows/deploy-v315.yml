name: Deploy v3.28
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v328:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.28
        run: python scripts/build_v328.py
      - name: Commit v3.28
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_v328.py Nangman_Integrated_Simulator_v3_28.html latest.json README.md
          git commit -m "Replace daomai route brute force with indexed collision engine v3.28" || exit 0
          git pull --rebase origin main
          git push
