name: Deploy v3.36
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v336:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.36
        run: python scripts/build_v336.py
      - name: Commit v3.36
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_v336.py Nangman_Integrated_Simulator_v3_36.html latest.json README.md
          git commit -m "Use N*4 cost floor and A-star beam for daomai routes in v3.36" || exit 0
          git pull --rebase origin main
          git push
