name: Deploy v3.29
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v329:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.29
        run: python scripts/build_v329.py
      - name: Commit v3.29
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_v329.py Nangman_Integrated_Simulator_v3_29.html latest.json README.md
          git commit -m "Use occurrence-tail daomai engine in v3.29" || exit 0
          git pull --rebase origin main
          git push
