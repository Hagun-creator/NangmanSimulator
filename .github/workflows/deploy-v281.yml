name: Deploy v2.81 equipment newline fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v281:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build v2.81 from v2.80
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          src = Path('Nangman_Integrated_Simulator_v2_80.html')
          dst = Path('Nangman_Integrated_Simulator_v2_81.html')
          if not src.exists():
              raise SystemExit('v2.80 source not found')

          text = src.read_text(encoding='utf-8')
          text = text.replace('v2.80', 'v2.81').replace('v2_80', 'v2_81')
          text = text.replace('id="v280-mobile-integrated"', 'id="v281-mobile-integrated"')

          m = re.search(r'const\s+EQUIPMENT_HTML_B64\s*=\s*"([A-Za-z0-9+/=]+)"\s*;', text)
          if not m:
              raise SystemExit('embedded equipment payload not found')

          inner = base64.b64decode(m.group(1)).decode('utf-8')
          inner = inner.replace('id="v280-mobile-equipment"', 'id="v281-mobile-equipment"')
          inner = inner.replace('v2.80', 'v2.81')

          # Remove literal backslash-n text nodes that can render visibly in the iframe.
          # 1) right after <body...>
          inner = re.sub(r'(<body\b[^>]*>)(?:\\n)+', r'\1', inner, count=1, flags=re.I)
          # 2) immediately before/after the injected mobile style block
          inner = inner.replace('\\n<style id="v281-mobile-equipment">', '<style id="v281-mobile-equipment">')
          inner = inner.replace('</style>\\n', '</style>')
          # 3) any standalone literal \n / \n\n text between tags near the top of body
          inner = re.sub(r'(?<=>)(?:\\n){1,4}(?=<)', '', inner)

          # Also protect outer document from the same artifact.
          text = re.sub(r'(<body\b[^>]*>)(?:\\n)+', r'\1', text, count=1, flags=re.I)
          text = text.replace('\\n<style id="v281-mobile-integrated">', '<style id="v281-mobile-integrated">')
          text = text.replace('</style>\\n', '</style>')

          # Validation: body start and mobile style boundaries must not contain literal backslash-n.
          body_probe = re.search(r'<body\b[^>]*>(.{0,160})', inner, re.I|re.S)
          if body_probe and '\\n' in body_probe.group(1):
              raise SystemExit('literal backslash-n remains at equipment body start')
          pos = inner.find('<style id="v281-mobile-equipment">')
          if pos < 0:
              raise SystemExit('equipment mobile style missing')
          if '\\n' in inner[max(0,pos-16):pos] or '\\n' in inner[inner.find('</style>',pos)+8:inner.find('</style>',pos)+24]:
              raise SystemExit('literal backslash-n remains around equipment style')

          enc = base64.b64encode(inner.encode('utf-8')).decode('ascii')
          text = text[:m.start()] + f'const EQUIPMENT_HTML_B64="{enc}";' + text[m.end():]

          if '<title>낭만강호 통합 시뮬레이터 v2.81</title>' not in text[:5000]:
              raise SystemExit('v2.81 title missing')
          dst.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8').replace('v2.80','v2.81').replace('v2_80','v2_81')
          idx.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              s = readme.read_text(encoding='utf-8').replace('v2.80','v2.81')
              readme.write_text(s, encoding='utf-8')
          PY
      - name: Commit generated v2.81
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_81.html index.html README.md
          git commit -m "Fix equipment literal newline text in v2.81"
          git push
