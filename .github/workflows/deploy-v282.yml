name: Deploy v2.82 stable root URL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v282:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build v2.82 and publish as index
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('Nangman_Integrated_Simulator_v2_81.html')
          dst = Path('Nangman_Integrated_Simulator_v2_82.html')
          if not src.exists():
              raise SystemExit('v2.81 source not found')

          text = src.read_text(encoding='utf-8')
          text = text.replace('v2.81', 'v2.82').replace('v2_81', 'v2_82')
          text = text.replace('id="v281-mobile-integrated"', 'id="v282-mobile-integrated"')
          text = text.replace('id="v281-mobile-equipment"', 'id="v282-mobile-equipment"')

          if '<title>낭만강호 통합 시뮬레이터 v2.82</title>' not in text[:5000]:
              raise SystemExit('v2.82 title missing')

          dst.write_text(text, encoding='utf-8')
          Path('index.html').write_text(text, encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              s = readme.read_text(encoding='utf-8')
              import re
              s = re.sub(r'현재 사이트 버전:\s*v[0-9.]+', '현재 사이트 버전: v2.82', s)
              readme.write_text(s, encoding='utf-8')

          idx = Path('index.html').read_text(encoding='utf-8')
          if 'location.replace(' in idx[:5000] or 'http-equiv="refresh"' in idx[:5000]:
              raise SystemExit('index still redirects')
          if '<title>낭만강호 통합 시뮬레이터 v2.82</title>' not in idx[:5000]:
              raise SystemExit('index is not v2.82 app')
          PY
      - name: Commit v2.82 stable-root deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_82.html index.html README.md
          git commit -m "Deploy v2.82 at stable root URL"
          git push
