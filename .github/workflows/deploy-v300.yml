name: Deploy v3.00
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v300:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.00
        run: python scripts/build_v300.py
      - name: Commit v3.00
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_00.html latest.json README.md
          git commit -m "Restore pre-pity #600+ daomai table in v3.00" || exit 0
          git push
