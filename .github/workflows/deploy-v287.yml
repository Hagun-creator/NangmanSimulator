name: Deploy v2.87
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v287:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.87
        run: python scripts/build_v287.py
      - name: Commit v2.87
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_87.html index.html README.md
          git commit -m "Deploy v2.87 with restored save loading and cache guards"
          git push
