name: Deploy v2.93 (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-v293:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.93
        run: python scripts/build_v293.py
      - name: Commit v2.93
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_93.html latest.json README.md
          git commit -m "Fix daomai exchange-1 click and add result panel in v2.93" || exit 0
          git push
