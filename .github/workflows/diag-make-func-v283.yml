name: Diagnose make function v2.83

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact function
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          t=Path('Nangman_Integrated_Simulator_v2_82.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+EQUIPMENT_HTML_B64\s*=\s*"([A-Za-z0-9+/=]+)"\s*;',t)
          s=base64.b64decode(m.group(1)).decode('utf-8','replace')
          key='function rkMakePreviewNative233(req,n)'
          p=s.find(key)
          if p<0: raise SystemExit('function missing')
          b=s.find('{',p); depth=0; end=None
          quote=None; esc=False
          for i in range(b,len(s)):
            c=s[i]
            if quote:
              if esc: esc=False
              elif c=='\\': esc=True
              elif c==quote: quote=None
              continue
            if c in "'\"`": quote=c; continue
            if c=='{': depth+=1
            elif c=='}':
              depth-=1
              if depth==0: end=i+1; break
          if not end: raise SystemExit('function end missing')
          Path('diag_make_func_v283.txt').write_text(s[p:end],encoding='utf-8')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag_make_func_v283.txt
          git commit -m "Extract make preview function for v2.83" || exit 0
          git push
