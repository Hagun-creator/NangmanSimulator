name: Deploy v2.91
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v291:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.91
        run: python scripts/build_v291.py
      - name: Commit v2.91
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_91.html index.html README.md
          git commit -m "Limit jammaek pull routes to exchange 1 in v2.91"
          git push
