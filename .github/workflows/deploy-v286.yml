name: Deploy v2.86
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v286:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.86
        run: python scripts/build_v286.py
      - name: Commit v2.86
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_86.html index.html README.md
          git commit -m "Restore save loading in v2.86"
          git push
