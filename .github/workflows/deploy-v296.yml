name: Deploy v2.96
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v296:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.96
        run: python scripts/build_v296.py
      - name: Commit v2.96
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_96.html latest.json README.md
          git commit -m "Restore baseline pity exchange 1-15 in v2.96"
          git push
