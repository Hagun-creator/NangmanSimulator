name: Deploy v2.96
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v296:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and capture diagnostics
        run: |
          set +e
          python scripts/build_v296.py > build_v296.log 2>&1
          echo $? > build_v296.exit
          cat build_v296.log
      - name: Commit diagnostic or v2.96
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_v296.log build_v296.exit Nangman_Integrated_Simulator_v2_96.html index.html latest.json README.md
          git commit -m "Run v2.96 final build diagnostics" || exit 0
          git push
