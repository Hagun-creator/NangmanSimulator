name: Diagnose v2.97 wash mechanics
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diag-v297:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect wash mechanics
        run: python scripts/diag_v297_wash.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag_v297_wash.txt
          git commit -m "Capture v2.97 wash mechanics" || exit 0
          git push
