name: Diagnose v2.84 detail back
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract detail navigation code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          t=Path('Nangman_Integrated_Simulator_v2_83.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+EQUIPMENT_HTML_B64\s*=\s*"([A-Za-z0-9+/=]+)"\s*;',t)
          if not m: raise SystemExit('payload missing')
          s=base64.b64decode(m.group(1)).decode('utf-8','replace')
          terms=['function showDetailTop233','function paintDetail','function paintResults','function paintFind','data-ri','←','뒤로','back218']
          lines=s.splitlines(); hit=set()
          for i,l in enumerate(lines):
            if any(x in l for x in terms):
              for j in range(max(0,i-12),min(len(lines),i+35)):hit.add(j)
          out=[]; prev=-2
          for j in sorted(hit):
            if j!=prev+1:out.append(f'\n--- {j+1} ---')
            out.append(f'{j+1}: {lines[j]}');prev=j
          Path('diag_v284_back.txt').write_text('\n'.join(out)[:160000],encoding='utf-8')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag_v284_back.txt
          git commit -m "Add v2.84 navigation diagnostic" || exit 0
          git push
