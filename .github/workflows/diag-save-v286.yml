name: Diagnose save load v2.86
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run diagnostic
        run: python scripts/diag_save_v286.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag_save_v286.txt
          git commit -m "Add v2.86 save-load diagnostic" || exit 0
          git push
