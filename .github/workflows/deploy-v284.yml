name: Deploy v2.84 search back position
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v284:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build v2.84 from v2.83
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          src=Path('Nangman_Integrated_Simulator_v2_83.html')
          dst=Path('Nangman_Integrated_Simulator_v2_84.html')
          if not src.exists(): raise SystemExit('v2.83 source missing')
          text=src.read_text(encoding='utf-8')
          m=re.search(r'const\s+EQUIPMENT_HTML_B64\s*=\s*"([A-Za-z0-9+/=]+)"\s*;',text)
          if not m: raise SystemExit('embedded equipment payload missing')
          inner=base64.b64decode(m.group(1)).decode('utf-8')
          old="function showDetailTop233(obj,backView,initialTab){R.sel=obj;R.detailBack233=backView||R.view;R.detailTab=initialTab||'xl';const m=q('#rmain');m.innerHTML=`<button type=\"button\" class=\"back218\" id=\"dback233\">← 이전 목록</button><div id=\"dtop233\"></div>`;q('#dback233').onclick=()=>open(R.detailBack233||'find');paintDetail(q('#dtop233'),obj);window.scrollTo({top:0,behavior:'instant'})}"
          new="function showDetailTop233(obj,backView,initialTab){R.sel=obj;R.detailBack233=backView||R.view;R.detailTab=initialTab||'xl';const m=q('#rmain');m.innerHTML=`<button type=\"button\" class=\"back218\" id=\"dback233\">← 이전 목록</button><div id=\"dtop233\"></div>`;q('#dback233').onclick=()=>{const back=R.detailBack233||'find';open(back);if(back==='find')setTimeout(()=>{const rr=q('#rresults');if(rr&&R.results.length)rr.scrollIntoView({block:'start',behavior:'instant'})},0)};paintDetail(q('#dtop233'),obj);window.scrollTo({top:0,behavior:'instant'})}"
          if inner.count(old)!=1: raise SystemExit(f'showDetailTop233 match count={inner.count(old)}')
          inner=inner.replace(old,new,1)
          if "if(back==='find')" not in inner or "q('#rresults')" not in inner:
              raise SystemExit('search result back-scroll patch missing')
          enc=base64.b64encode(inner.encode('utf-8')).decode('ascii')
          text=text[:m.start()]+f'const EQUIPMENT_HTML_B64="{enc}";'+text[m.end():]
          text=text.replace('v2.83','v2.84').replace('v2_83','v2_84')
          text=text.replace('id="v283-mobile-integrated"','id="v284-mobile-integrated"')
          text=text.replace('id="v283-mobile-equipment"','id="v284-mobile-equipment"')
          if '<title>낭만강호 통합 시뮬레이터 v2.84</title>' not in text[:5000]: raise SystemExit('v2.84 title missing')
          dst.write_text(text,encoding='utf-8')
          Path('index.html').write_text(text,encoding='utf-8')
          readme=Path('README.md')
          if readme.exists():
              s=readme.read_text(encoding='utf-8')
              s=re.sub(r'현재 사이트 버전:\s*v[0-9.]+','현재 사이트 버전: v2.84',s)
              readme.write_text(s,encoding='utf-8')
          PY
      - name: Commit v2.84
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_84.html index.html README.md
          git commit -m "Keep search results in view when returning from detail in v2.84"
          git push
