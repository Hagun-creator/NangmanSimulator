name: Diagnose v2.89 N rows
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/diag_v289_nrows.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag_v289_nrows.txt
          git commit -m "Add v2.89 N-table diagnostic" || exit 0
          git push
