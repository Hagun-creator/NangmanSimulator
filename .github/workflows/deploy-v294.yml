name: Deploy v2.94
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v294:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.94
        run: python scripts/build_v294.py
      - name: Commit v2.94
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_94.html latest.json README.md
          git commit -m "Add raw-row daomai routes and direct-lock comparison in v2.94"
          git push
