name: Diagnose v2.88 daomai
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/diag_v288_daomai.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag_v288_daomai.txt
          git commit -m "Add v2.88 daomai diagnostic" || exit 0
          git push
