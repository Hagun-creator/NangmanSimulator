name: Deploy v3.11
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v311:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.11
        run: python scripts/build_v311.py
      - name: Commit v3.11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_11.html latest.json README.md
          git commit -m "Restore v3.09 base and fix duplicate-skip layout in v3.11" || exit 0
          git pull --rebase origin main
          git push
