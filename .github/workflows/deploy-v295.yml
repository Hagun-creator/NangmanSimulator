name: Deploy v2.95
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v295:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.95
        run: python scripts/build_v295.py
      - name: Commit v2.95
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_95.html latest.json README.md
          git commit -m "Fix pity baseline and normal-row alignment in v2.95"
          git push
