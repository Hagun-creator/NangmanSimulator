name: Deploy v3.01
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v301:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.01
        run: python scripts/build_v301.py
      - name: Commit v3.01
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_01.html latest.json README.md
          git commit -m "Keep pre-pity raw list and move exchange table to raw 600+ in v3.01" || exit 0
          git push
