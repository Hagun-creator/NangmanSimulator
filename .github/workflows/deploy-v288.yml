name: Deploy v2.88
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v288:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v2.88
        run: python scripts/build_v288.py
      - name: Commit v2.88
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v2_88.html index.html README.md
          git commit -m "Simplify daomai tools in v2.88"
          git push
