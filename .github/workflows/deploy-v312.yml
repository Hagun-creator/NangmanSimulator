name: Deploy v3.12
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v312:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.12
        run: python scripts/build_v312.py
      - name: Commit v3.12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_12.html latest.json README.md
          git commit -m "Restore daomai interval exchange table in v3.12" || exit 0
          git pull --rebase origin main
          git push
