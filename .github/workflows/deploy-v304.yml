name: Deploy v3.04
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-v304:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate v3.04
        run: python scripts/build_v304.py
      - name: Commit v3.04
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nangman_Integrated_Simulator_v3_04.html latest.json README.md
          git commit -m "Fix daomai exchange button in v3.04" || exit 0
          git push
