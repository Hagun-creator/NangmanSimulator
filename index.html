<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>낭만강호 통합 시뮬레이터</title>
</head>
<body>
<div id="status">최신 버전을 불러오는 중...</div>
<script>
(async()=>{
  try{
    const r=await fetch('./latest.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('latest.json '+r.status);
    const j=await r.json();
    const u='./'+j.file+'?build='+encodeURIComponent(j.version)+'&ts='+Date.now();
    location.replace(u);
  }catch(e){
    document.getElementById('status').textContent='최신 버전 확인 실패: '+e;
  }
})();
</script>
</body>
</html>
